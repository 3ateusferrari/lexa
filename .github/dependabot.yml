version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint*"
      vite:
        patterns:
          - "vite*"
          - "@vitejs/*"
      testcontainers:
        patterns:
          - "testcontainers*"
          - "@testcontainers/*"
      drizzle:
        patterns:
          - "drizzle-orm*"
          - "drizzle-kit*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
